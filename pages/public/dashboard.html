<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Dashboard | Stackly Sports Club</title>
  <link rel="icon" type="image/webp" href="../../assets/images/logoStackly.webp">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script>
    (function routeDashboard() {
      try {
        var userRaw = localStorage.getItem('currentUser');
        var role = localStorage.getItem('role');
        if (!userRaw) {
          window.location.replace('../auth/sign-in.html');
          return;
        }
        var user = JSON.parse(userRaw);
        var targetRole = role || (user && user.role) || 'member';
        if (targetRole === 'coach') {
          window.location.replace('../coach/coach-dashboard.html');
        } else {
          window.location.replace('../member/member-dashboard.html');
        }
      } catch (err) {
        window.location.replace('../auth/sign-in.html');
      }
    })();
  </script>
</head>
<body style="background-color: #0f172a; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; position: relative; overflow-y: auto; overflow-x: hidden; font-family: var(--font-primary);">
  <div class="hero-bg-overlay" style="background-image: url('../../assets/images/facility-indoor-arena.webp');" aria-hidden="true"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.65) 0%, rgba(7, 11, 18, 0.85) 100%); z-index: 1; pointer-events: none;"></div>

  <div style="position: relative; z-index: 2; text-align: center; padding: 2rem;">
    <img src="../../assets/images/logoStackly.webp" alt="Stackly Sports Club Logo" style="height: 60px; margin-bottom: 1.5rem;">
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #ffffff;">Accessing Your Athletic Dashboard...</h2>
    <p style="color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem;">Connecting you to your dedicated role portal.</p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="../member/member-dashboard.html" class="btn btn-primary btn-sm">Member Portal</a>
      <a href="../coach/coach-dashboard.html" class="btn btn-outline btn-sm">Coach Console</a>
    </div>
  </div>

  <!-- BACK TO TOP BUTTON -->
  <button type="button" id="backToTopBtn" class="back-to-top-btn" aria-label="Back to top of page" title="Back to top">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

</body>
</html>
